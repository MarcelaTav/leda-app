<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LEDA — teste da tela de login</title>
    <meta name="theme-color" content="#F6F1E7" />
    <style>
      html, body {
        margin: 0; padding: 0;
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #F6F1E7;
        overscroll-behavior: none;
      }
      * { box-sizing: border-box; }

      #tela {
        position: absolute; top: 0; left: 0; right: 0;
        height: 100%;
        overflow: hidden;           /* a tela nunca rola: nada de balanço */
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 8px 20px 20px;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        color: #3E3A31;
        background:
          radial-gradient(ellipse 65% 42% at 15% -6%, rgba(224,158,148,0.22) 0%, rgba(224,158,148,0) 60%),
          radial-gradient(ellipse 60% 46% at 102% 106%, rgba(124,144,112,0.40) 0%, rgba(124,144,112,0) 62%),
          radial-gradient(ellipse 90% 70% at 50% 40%, #FBF6ED 0%, #F6F1E7 70%);
      }

      .cartao {
        width: 100%; max-width: 380px;
        background: rgba(255,253,248,0.88);
        backdrop-filter: blur(20px) saturate(1.08);
        -webkit-backdrop-filter: blur(20px) saturate(1.08);
        border: 1px solid rgba(231,223,204,0.9);
        border-radius: 24px;
        padding: 20px 26px 26px;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.95),
          0 0 0 1px rgba(124,144,112,0.07),
          0 2px 6px rgba(62,58,49,0.05),
          0 26px 60px rgba(62,58,49,0.14);
      }
      .selo {
        display: flex; align-items: center; justify-content: center;
        width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
        background: radial-gradient(circle at 35% 30%, #F3ECD9 0%, #E7EDDF 75%);
        margin: 0 auto 12px; box-shadow: 0 4px 14px rgba(124,144,112,0.22);
      }
      .marca {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        font-family: -apple-system, sans-serif; font-size: 10.5px;
        letter-spacing: 0.16em; text-transform: uppercase; color: #5F7355; margin-bottom: 6px;
      }
      h1 { font-size: 23px; font-weight: 700; margin: 0 0 6px; text-align: center; }
      .sub { font-family: -apple-system, sans-serif; font-size: 12.5px; color: #8A8168; text-align: center; margin-bottom: 18px; }
      .enfeite { display: block; margin: 0 auto 24px; }
      form { display: flex; flex-direction: column; gap: 14px; }
      .rot { font-family: -apple-system, sans-serif; font-size: 11.5px; color: #8A8168; margin-bottom: 5px; }
      input {
        width: 100%; font-size: 16px; padding: 10px 13px; border-radius: 11px;
        border: 1.5px solid rgba(199,189,166,0.85);
        font-family: -apple-system, sans-serif; background: rgba(253,251,246,0.9); outline: none;
      }
      .esqueci { text-align: right; margin-top: -6px; font-family: -apple-system, sans-serif; font-size: 12px; color: #8A8168; text-decoration: underline; }
      .entrar {
        font-family: -apple-system, sans-serif; font-size: 13.5px; font-weight: 600;
        padding: 13px; border-radius: 10px; border: none; background: #7C9070; color: #fff; margin-top: 4px;
        box-shadow: 0 6px 16px rgba(124,144,112,0.32);
      }
      .divisor { height: 1px; background: #E7DFCC; margin: 22px 0 18px; }
      .rodape { font-family: -apple-system, sans-serif; font-size: 12.5px; color: #8A8168; text-align: center; }
      .rodape b { color: #5F7355; text-decoration: underline; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="tela">
      <div class="cartao" id="cartao">
        <div class="selo">
          <svg viewBox="0 0 48 48" width="26" height="26">
            <circle cx="24" cy="15" r="8.5" fill="#E7A99A" opacity="0.5"/>
            <path d="M6 17 C6 15 10 13 16 14 C20 14.6 23 16 24 18 C25 16 28 14.6 32 14 C38 13 42 15 42 17 L42 32 C42 30 38 28 32 28.6 C28 29.2 25 30.6 24 32.4 C23 30.6 20 29.2 16 28.6 C10 28 6 30 6 32 Z" fill="none" stroke="#5F7355" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M24 18 L24 32.4" stroke="#5F7355" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="marca"><span>Leda</span>
          <svg viewBox="0 0 20 20" width="10" height="10" style="opacity:.75"><path d="M10 2 C11 6 14 7 18 8 C14 9 11 11 10 15 C9 11 6 9 2 8 C6 7 9 6 10 2 Z" fill="#7C9070"/></svg>
        </div>
        <h1>Bem-vinda de volta</h1>
        <div class="sub">Entre para continuar sua estante.</div>
        <svg class="enfeite" viewBox="0 0 120 14" width="70" height="8"><path d="M2 2 C 30 14, 90 14, 118 2" fill="none" stroke="#7C9070" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/></svg>
        <form onsubmit="return false">
          <div><div class="rot">E-mail</div><input type="email" placeholder="voce@exemplo.com"></div>
          <div><div class="rot">Senha</div><input type="password" placeholder="pelo menos 6 caracteres"></div>
          <div class="esqueci">Esqueci minha senha</div>
          <button class="entrar">Entrar</button>
        </form>
        <div class="divisor"></div>
        <div class="rodape">Ainda não tem conta? <b>Criar conta</b></div>
      </div>
    </div>

    <script>
      // A altura da tela acompanha a área realmente visível (o teclado encolhe
      // essa área). Assim o Safari não tem página sobrando pra arrastar, e o
      // que passar do espaço rola por dentro do próprio cartão.
      (function () {
        var vv = window.visualViewport;
        var tela = document.getElementById('tela');
        function ajustar() {
          var h = vv ? vv.height : window.innerHeight;
          tela.style.height = h + 'px';
          document.documentElement.style.height = h + 'px';
          document.body.style.height = h + 'px';
          if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
        }
        ajustar();
        setTimeout(ajustar, 300);
        if (vv) {
          vv.addEventListener('resize', ajustar);
          vv.addEventListener('scroll', ajustar);
        }
        window.addEventListener('resize', ajustar);
      })();

      // Ao tocar num campo, o Safari desloca o conteúdo do cartão pra cima
      // pra "mostrar" o campo — mesmo quando ele já está visível. É isso que
      // fazia o cartão sair do lugar. Aqui esse deslocamento é desfeito, e o
      // cartão fica parado o tempo todo.
      (function () {
        var cartao = document.getElementById('cartao');
        var travado = false;

        function fixar() {
          if (cartao.scrollTop !== 0) cartao.scrollTop = 0;
        }

        cartao.addEventListener('scroll', function () {
          if (travado) fixar();
        });

        Array.prototype.forEach.call(cartao.querySelectorAll('input'), function (campo) {
          campo.addEventListener('focus', function () {
            travado = true;
            fixar();
            // o Safari faz o ajuste dele em etapas; desfaz durante 1 segundo
            var ate = Date.now() + 1000;
            (function repetir() {
              fixar();
              if (Date.now() < ate) requestAnimationFrame(repetir);
            })();
          });
          campo.addEventListener('blur', function () {
            setTimeout(function () { travado = false; }, 250);
          });
        });
      })();
    </script>
  </body>
</html>
